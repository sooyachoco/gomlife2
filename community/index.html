<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4ec">
<title>우리 둘의 이야기</title>
<style>
:root{--bg:#fbf4ec;--card:#fffdfa;--ink:#5a4437;--muted:#a28b7b;--pink:#f58f92;--pink-soft:#ffe4e1;--blue:#6f91c5;--line:#f1e2d6;--shadow:0 8px 26px rgba(117,76,48,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:34px}.top{position:sticky;top:0;z-index:10;height:68px;padding:0 16px;background:rgba(251,244,236,.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(241,226,214,.65)}.back{display:flex;align-items:center;gap:5px;padding:9px 10px;border-radius:14px;color:#8a7060;font-size:13px;font-weight:800;text-decoration:none}.back:active{background:#f5e9df}.back svg{width:18px;height:18px}.top-title{font-size:20px;font-weight:900;letter-spacing:-.07em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}.heart{width:38px;height:38px;border:1px solid #f3ddd1;border-radius:50%;display:grid;place-items:center;background:#fffaf5;color:#f28b8e}.heart svg{width:19px}
/* 원본 히어로 이미지의 흰색 상·하단을 보이지 않도록 이미지 자체를 확대해 잘라낸다. */
.hero{margin:0 0 16px;border-radius:0;overflow:hidden;box-shadow:none;background:transparent;width:100%;height:auto;aspect-ratio:2.25/1;line-height:0}.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;transform:scale(1.12);margin:0;padding:0}
.tabs{padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{height:52px;border-radius:18px;border:1px solid var(--line);background:#fffaf6;color:#a18b7c;font-size:14px;font-weight:900;letter-spacing:-.04em}.tab.active{background:var(--pink-soft);border-color:#ffd0cc;color:#e7777d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}.feed{padding:0 14px}.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}.post-head{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:15px;overflow:hidden;flex:0 0 auto;background:#f8e8d9}.avatar img{width:100%;height:100%;display:block;object-fit:cover}.author{font-size:13px;font-weight:900}.author.g{color:#e27b80}.author.s{color:var(--blue)}.time{margin-top:2px;font-size:11px;color:#b09b8e}.more{margin-left:auto;font-size:19px;color:#b09b8e;padding:4px}.title{font-size:17px;font-weight:800;letter-spacing:-.055em;margin:12px 0 11px;line-height:1.4}.meta{display:flex;gap:18px;color:#b09b8e;font-size:12px;border-top:1px solid #f4e8df;padding-top:10px}.meta span{display:flex;align-items:center;gap:5px}.meta .love{color:#ef8d91}.write{position:sticky;bottom:16px;margin:14px 14px 0;height:54px;width:calc(100% - 28px);border-radius:20px;background:linear-gradient(135deg,#f69a9c,#f4868b);color:white;font-size:16px;font-weight:900;box-shadow:0 12px 24px rgba(239,133,139,.25)}.write:active{transform:translateY(1px)}.empty{display:none;text-align:center;padding:48px 20px;color:#a99284}.empty strong{display:block;color:#80695b;font-size:16px;margin-bottom:7px}.compose{display:none;position:fixed;inset:0;z-index:30;background:rgba(67,45,35,.3);align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffaf6;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(72,44,28,.15)}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:19px;margin:0}.close{font-size:24px;color:#9b8475}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;outline:none;margin-top:14px}.field:focus{border-color:#f3b1af}.textarea{min-height:110px;resize:vertical}.author-pick{display:flex;gap:8px;margin-top:12px}.pick{flex:1;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}.pick.selected{background:var(--pink-soft);border-color:#ffc9c6}.submit{width:100%;height:48px;margin-top:12px;border-radius:15px;background:#f58f92;color:#fff;font-weight:900}@media(min-width:521px){body{background:#f1e7de}.app{background:var(--bg);box-shadow:0 0 50px rgba(77,52,35,.08)}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<a class="back" href="../" aria-label="곰라이프로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg><span>곰라이프</span></a>
<div class="top-title">♡ 우리 둘의 이야기 ♡</div>
<button class="heart" aria-label="우리 둘"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.4S4 15.5 4 9.2C4 6.5 5.9 5 8.1 5c1.5 0 3 .8 3.9 2.2C12.9 5.8 14.4 5 15.9 5 18.1 5 20 6.5 20 9.2c0 6.3-8 11.2-8 11.2Z"/></svg></button>
</header>
<section class="hero"><img src="file_00000000d558820993006dc10ae26a8f.png" alt="우리 둘의 작은 공간"></section>
<nav class="tabs"><button class="tab active" data-author="지연">🐻 지연의 이야기</button><button class="tab" data-author="승수">🐰 승수의 이야기</button></nav>
<section class="feed" id="feed">
<article class="post" data-author="지연"><div class="post-head"><div class="avatar"><img src="file_00000000dfa0820996a2aa3262a12309.png" alt="지연"></div><div><div class="author g">지연</div><div class="time">2시간 전</div></div><button class="more">···</button></div><div class="title">오늘 문득 생각난 것</div><div class="meta"><span class="love">♡ 5</span><span>○ 3</span></div></article>
<article class="post" data-author="승수"><div class="post-head"><div class="avatar"><img src="file_00000000dfa0820996a2aa3262a12309(1).png" alt="승수"></div><div><div class="author s">승수</div><div class="time">5시간 전</div></div><button class="more">···</button></div><div class="title">오늘 있었던 일</div><div class="meta"><span class="love">♡ 3</span><span>○ 1</span></div></article>
<article class="post" data-author="지연"><div class="post-head"><div class="avatar"><img src="file_00000000dfa0820996a2aa3262a12309.png" alt="지연"></div><div><div class="author g">지연</div><div class="time">어제</div></div><button class="more">···</button></div><div class="title">바람 좋은 저녁</div><div class="meta"><span class="love">♡ 6</span><span>○ 2</span></div></article>
<article class="post" data-author="승수"><div class="post-head"><div class="avatar"><img src="file_00000000dfa0820996a2aa3262a12309(1).png" alt="승수"></div><div><div class="author s">승수</div><div class="time">어제</div></div><button class="more">···</button></div><div class="title">퇴근길에</div><div class="meta"><span class="love">♡ 4</span><span>○ 1</span></div></article>
</section>
<div class="empty" id="empty"><strong>아직 남겨진 이야기가 없어요.</strong>첫 번째 이야기를 남겨볼까요? ♡</div>
<button class="write" id="write">✏️ 이야기 남기기</button>
</main>
<div class="compose" id="compose"><div class="sheet"><div class="sheet-top"><h2>새 이야기</h2><button class="close" id="close">×</button></div><input class="field" id="postTitle" maxlength="60" placeholder="제목을 적어주세요"><textarea class="field textarea" id="postBody" placeholder="내용은 다음 단계에서 연결할 수 있어요."></textarea><div class="author-pick"><button class="pick selected" data-pick="지연">🐻 지연</button><button class="pick" data-pick="승수">🐰 승수</button></div><button class="submit" id="submit">임시로 남겨보기</button></div></div>
<script>
const tabs=[...document.querySelectorAll('.tab')];const posts=[...document.querySelectorAll('.post')];const empty=document.getElementById('empty');
function filter(author){tabs.forEach(t=>t.classList.toggle('active',t.dataset.author===author));let n=0;posts.forEach(p=>{const show=p.dataset.author===author;p.style.display=show?'block':'none';if(show)n++});empty.style.display=n?'none':'block'}
tabs.forEach(t=>t.addEventListener('click',()=>filter(t.dataset.author)));filter('지연');
const compose=document.getElementById('compose');document.getElementById('write').onclick=()=>compose.style.display='flex';document.getElementById('close').onclick=()=>compose.style.display='none';compose.addEventListener('click',e=>{if(e.target===compose)compose.style.display='none'});
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pick').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
document.getElementById('submit').onclick=()=>{alert('글쓰기 기능은 D1 연결 단계에서 실제 저장됩니다.');compose.style.display='none'};
</script>
</body>
</html>
