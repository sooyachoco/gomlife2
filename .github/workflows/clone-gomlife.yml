name: Sync Gomlife

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gomlife2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy original Gomlife except cup
        run: |
          git clone --depth 1 https://github.com/sooyachoco/Gomlife.git /tmp/gomlife
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('/tmp/gomlife')
          dst = Path('.')
          for item in src.iterdir():
              if item.name in {'.git', '.github', 'cup'}:
                  continue
              target = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Add community button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    </main>'
          button = '''
      <section class="community-card" aria-label="우리 커뮤니티">
        <a href="https://community.sooyachoco.workers.dev" class="community-link">
          <div class="community-copy">
            <span class="community-kicker">TOGETHER</span>
            <strong>우리 커뮤니티</strong>
            <span>오늘 하루 어땠어?</span>
          </div>
          <span class="community-arrow" aria-hidden="true">→</span>
        </a>
      </section>
'''
          css = '''
<style>
.community-card{margin:28px 0 42px}.community-link{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 20px;border-radius:24px;background:var(--ivory,#fffdf7);border:1px solid rgba(114,128,111,.18);box-shadow:0 8px 24px rgba(47,57,47,.06);text-decoration:none;color:var(--ink,#2f392f)}.community-copy{display:flex;flex-direction:column;gap:5px}.community-kicker{font-size:10px;letter-spacing:.16em;color:var(--muted,#72806f)}.community-copy strong{font-size:20px;line-height:1.2}.community-copy>span:last-child{font-size:13px;color:var(--muted,#72806f)}.community-arrow{font-size:24px;color:var(--muted,#72806f)}@media(max-width:600px){.community-card{margin:24px 0 32px}.community-link{padding:19px 18px;border-radius:21px}.community-copy strong{font-size:18px}}
</style>
'''
          if 'class="community-card"' not in s:
              if marker not in s:
                  raise SystemExit('Could not find main closing marker')
              s = s.replace('</head>', css + '</head>', 1)
              s = s.replace(marker, button + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync Gomlife without cup and add community button"
          git push
