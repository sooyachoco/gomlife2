name: Sync Gomlife

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gomlife2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy original Gomlife except cup
        run: |
          rm -rf /tmp/gomlife
          git clone --depth 1 https://github.com/sooyachoco/Gomlife.git /tmp/gomlife
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('/tmp/gomlife')
          dst = Path('.')
          for item in src.iterdir():
              if item.name in {'.git', '.github', 'cup'}:
                  continue
              target = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Add community button in Gomlife style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<section class="community-card"[\s\S]*?</section>\s*', '\n', s)
          s = re.sub(r'\s*<style>\s*\.community-card\{[\s\S]*?</style>\s*', '\n', s)
          button = '''\n<div class="community-entry" aria-label="우리 커뮤니티">\n  <a href="https://community.sooyachoco.workers.dev" class="community-entry-link">\n    <span>우리 커뮤니티</span><span aria-hidden="true">›</span>\n  </a>\n</div>\n'''
          css = '''\n<style>\n.community-entry{width:100%;box-sizing:border-box;margin:18px 0 28px}\n.community-entry-link{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:100%;padding:15px 16px;border:1px solid rgba(80,80,80,.10);border-radius:14px;background:rgba(255,255,255,.72);color:inherit;text-decoration:none;font:inherit;line-height:1.3;-webkit-tap-highlight-color:transparent}\n.community-entry-link span:first-child{font-size:.95em;font-weight:500}\n.community-entry-link span:last-child{font-size:1.35em;line-height:1;opacity:.45}\n.community-entry-link:active{transform:scale(.99)}\n@media(max-width:600px){.community-entry{margin:16px 0 24px}.community-entry-link{padding:14px 15px;border-radius:13px}}\n</style>\n'''
          if 'class="community-entry"' not in s:
              pos = s.lower().rfind('</body>')
              if pos >= 0:
                  s = s[:pos] + button + s[pos:]
              else:
                  s += button
          pos = s.lower().rfind('</head>')
          if pos >= 0 and '.community-entry{' not in s:
              s = s[:pos] + css + s[pos:]
          p.write_text(s, encoding='utf-8')
          print('Community entry updated')
          PY

      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Match community button to Gomlife style"
          git push
