name: Sync Gomlife

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gomlife2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy original Gomlife except cup
        run: |
          rm -rf /tmp/gomlife
          git clone --depth 1 https://github.com/sooyachoco/Gomlife.git /tmp/gomlife
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('/tmp/gomlife')
          dst = Path('.')
          for item in src.iterdir():
              if item.name in {'.git', '.github', 'cup'}:
                  continue
              target = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Add community card by cloning the Gomlife diary card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<div[^>]*class="community-entry"[\s\S]*?</div>\s*', '\n', s)
          s = re.sub(r'\s*<script[^>]*data-gomlife-community-script[^>]*>[\s\S]*?</script>\s*', '\n', s)
          script = r'''<script data-gomlife-community-script>
          (function(){
            function add(){
              const nodes=[...document.querySelectorAll('body *')];
              const label=nodes.find(el=>el.children.length===0 && /일기/.test(el.textContent.trim()));
              if(!label || document.querySelector('[data-gomlife-community]')) return;
              let card=label;
              for(let i=0;i<10 && card.parentElement;i++){
                const parent=card.parentElement;
                const same=[...parent.children].filter(x=>x.tagName===card.tagName && x.className===card.className);
                if(same.length>=2) break;
                card=parent;
              }
              const clone=card.cloneNode(true);
              clone.setAttribute('data-gomlife-community','true');
              const walker=document.createTreeWalker(clone,NodeFilter.SHOW_TEXT);
              const texts=[]; while(walker.nextNode()) texts.push(walker.currentNode);
              texts.forEach(n=>{
                const t=n.nodeValue.trim();
                if(/일기/.test(t)) n.nodeValue=n.nodeValue.replace(t,'우리 커뮤니티');
                else if(t==='오늘의 기록') n.nodeValue=n.nodeValue.replace('오늘의 기록','오늘 하루 어땠어?');
                else if(t==='매일의 이야기를 기록해요') n.nodeValue=n.nodeValue.replace('매일의 이야기를 기록해요','오늘 하루 어땠어?');
              });
              clone.querySelectorAll('a').forEach(a=>a.href='https://community.sooyachoco.workers.dev');
              if(clone.tagName==='A') clone.href='https://community.sooyachoco.workers.dev';
              card.parentElement.appendChild(clone);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',add); else add();
          })();
          </script>'''
          pos=s.lower().rfind('</body>')
          if pos>=0: s=s[:pos]+script+'\n'+s[pos:]
          else: s+=script
          p.write_text(s,encoding='utf-8')
          print('Community card now clones the Gomlife diary card')
          PY

      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clone Gomlife diary card for community"
          git push
